#
# General FAQs
#

- question: Khoa học dữ liệu làm gì?
  tags: ['General']
  answer: |-
    - Cung cấp các khoá học hoàn toàn miễn phí
    - Viết blog về khoa học dữ liệu
    - Xây dựng cộng đồng data, ML, AI tại Việt Nam

    Để biết thêm thông tin, xem trang [Giới thiệu](/gioi-thieu)

- question: Khoa học dữ liệu là miễn phí?
  tags: ['General']
  answer: |-
    Đúng vậy. Toàn bộ nội dung trên www.khoahocdulieu.org là miễn phí,
    và được public trên [GitHub](https://github.com/Khoa-Hoc-Du-Lieu/docs)

- question: Khoa học dữ liệu có nhận donate/sponsor không?
  tags: ['General']
  answer: |-
    Không. Chúng tôi chưa có ý định đó.

- question: Khoa học dữ liệu duy trì bằng cách nào?
  tags: ['General']
  answer: |-
    Nhờ sử dụng Netlify nên chúng tôi chỉ cần duy trì tên miền.  
    Các nội dung có thể được cộng đồng đóng góp sử dụng GitHub, xem trang [CONTRIBUTING](https://github.com/Khoa-Hoc-Du-Lieu/docs/blob/main/CONTRIBUTING.md)

- question: Làm sao để xoá bình luận?
  tags: ['General']
  answer: |-
    1. Truy cập [mục comments trên trang diễn đàn GitHub](https://github.com/Khoa-Hoc-Du-Lieu/docs/discussions/categories/comments)  
    2. Tìm đến bài mà tiêu đề là đường link đến trang bạn bình luận
    3. Bạn có thể xoá bình luận của mình tại đây bằng cách nhấn vào biểu tượng `...` ở góc phải bình luận của bạn, chọn `Delete`

- question: Tôi cần có khoá học/chức năng mới làm sao để đề xuất?
  tags: ['General']
  answer: |-
    Có một số cách sau:
    - [Đề xuất] Nhấn [Báo lỗi](https://github.com/Khoa-Hoc-Du-Lieu/docs/issues/new/choose) trên menu, 
    chọn `🎉 Feature request` để bắt đầu đề xuất
    - Nhấn Tài nguyên -> Diễn Đàn, chọn mục Ideas -> New discussion để bắt đầu đề xuất
    - Nhấn Cộng đồng -> Disscord, gia nhập Discord, đề xuất trong channel #ideas dưới mục "Đại sảnh đường"
    - Liên hệ trực tiếp với chúng tôi qua [Facebook](https://www.facebook.com/khoahocdulieu.org)

- question: Tôi gặp lỗi, làm sao để báo lỗi?
  tags: ['General']
  answer: |-
    - Nhấn [Báo lỗi](https://github.com/Khoa-Hoc-Du-Lieu/docs/issues/new/choose) trên menu, 
    chọn `🐛 Bug report` nếu là lỗi kỹ thuật, chọn `📕 Content Issue` nếu là lỗi nội dung

- question: Tôi gặp lỗi, và biết cách sửa, làm sao để báo và sửa lỗi này cho mọi người?
  tags: ['General']
  answer: |-
   - Nhấn [Báo lỗi](https://github.com/Khoa-Hoc-Du-Lieu/docs/issues/new/choose) trên menu, 
    chọn `🐛 Bug report` nếu là lỗi kỹ thuật, chọn `📕 Content Issue` nếu là lỗi nội dung
    - Sau đó đến trang [CONTRIBUTING](https://github.com/Khoa-Hoc-Du-Lieu/docs/blob/main/CONTRIBUTING.md)
    của chúng tôi trên GitHub để biết chi tiết cách tham gia đóng góp nội dung.

- question: Làm sao để đóng góp nội dung cho Khoahocdulieu.org
  tags: ['General']
  answer: |-
    Xem trang [CONTRIBUTING](https://github.com/Khoa-Hoc-Du-Lieu/docs/blob/main/CONTRIBUTING.md)
    của chúng tôi trên GitHub để biết chi tiết cách tham gia đóng góp nội dung.

- question: Vì sao khoá học dừng lại ở mức độ trung bình?
  tags: ['General']
  answer: |-
    Vì vượt mức trung bình, chúng tôi tin các bạn đã có đủ kiến thức để tiếp tục học bằng tiếng Anh. 
    Có rất nhiều bài viết và khoá học đã có sẵn bằng tiếng Anh.

- question: Vì sao commit, pull request cần sử dụng tiếng Anh vậy?
  tags: ['General']
  answer: |-
    Vì chúng tôi muốn cùng tuân theo các phong cách và quy ước phổ biến trên toàn cầu.

#
# Technical FAQs
#

- question: Công nghệ phía sau trang web này là gì?
  tags: ['Technical']
  answer: |-
    - Khoahocdulieu.org được build sử dụng GitHub Actions.
    Xây dựng trên [Docusarus](https://docusaurus.io), 
    với mẫu từ [Dyte](https://docs.dyte.io/) và [Ionic](https://ionicframework.com/docs)
    - Video được đăng trên [YouTube](https://www.youtube.com/@khoahocdulieu)
    - Đi sâu hơn nữa, các trang của khoahocdulieu.org được xây dựng trên 
    MDX, JSX, TypeScript, Tailwind CSS, Sass,... 
    - Deploy với GitHub Actions, và được host trên Netlify.

    Để biết thêm thông tin, xem trang [GitHub](https://github.com/Khoa-Hoc-Du-Lieu/docs)


- question: Icon đẹp cho website?
  tags: ['Technical']
